[mod-name]
OCs_launching_calculator=OCs Rocket Launch Calculator

[mod-description]
OCs_launching_calculator=Calculate weater the inputs or outputs of a recipe are cheaper to launch into orbit. Handles fluids in barrels. Check and uncheck parts of a recipe to include or exclude it from the calculation. It also adds the item mass as tool tip.

[ocs-launching-calculator]
# Main Frame
title=Rocket Launch Calculator
close=Close
minimise=Minimise
restore=Restore
recipe=Recipe:
no-recipe=No recipe selected
click-to-select-recipe=Click an icon to select it as recipe if there is only one matching recipe. (if possible)
select-recipe=Select a recipe to compare launch masses.

# Rocket/Silo Types
silo-types=Silo Type
rocket-types=Rocket Type
max-lift-weight=Maximum lift weight: __1__
rocket-recipe-tip=Crafting cycles required: __1__

# I/O tables
inputs=Inputs
outputs=Outputs

header-icon=Icon
header-item=Item
header-amount=Amount
header-unit-mass=Unit mass (kg)
header-total-mass=Total mass (kg)
header-rocket-ratio=Rocket launchs needed
unit-mass-exceeds-rocket-capacity=This item exceeds the rocket's lift capacity and cannot be launched.

# Sum Frame
sum=Sum
sum-inputs=Inputs
sum-outputs=Outputs
header-type=Type
header-sum-amount=Sum of item quantities
header-sum-mass=Sum of total item masses
header-rocket-ratio-tooltip=Theoretical rocket count based on total mass and rocket lift capacity

# Tooltips
include-row=Include this row in the launch-mass total.
no-barrel-tooltip=This fluid has no barrel alternative and cannot be launched.
