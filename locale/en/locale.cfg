# Recommendation Frame
recommend-inputs=Recommendation: Launch inputs
recommend-outputs=Recommendation: Launch outputs
recommend-equal=Recommendation: Either side; launch masses are equal
recommendation-detail1=The heavier side has __1__ × as much mass.
recommendation-detail2=You could save __1__% rocket parts.

[mod-setting-name]
round_decimals=Decimal places
oc-calc-window-width=Window width (pixels)
oc-calc-show-item-name=Show item names
oc-calc-compact-window-factor=Compact window width (%)

[mod-setting-description]
round_decimals=Number of decimal places used for displayed amounts and masses. Set to 0 to round to whole numbers.
"oc-calc-show-item-name=If deactivated, the name is shown as tooltip instead.
oc-calc-compact-window-factor=Window width as a percentage of the normal width when the item name column is hidden.
