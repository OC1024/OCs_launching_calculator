[mod-name]
ocs-launching-calculator=OCs RocketLaunching Calculator

[mod-description]
ocs-launching-calculator=Calculate weater the inputs or outputs of a recipe are cheaper to launch into orbit. Handles fluids in barrels. Check and uncheck parts of a recipe to include or exclude it from the calculation.

