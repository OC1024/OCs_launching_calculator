[mod-name]
title=OCs Rocket Launch Calculator

[mod-description]
description=Calculate weater the inputs or outputs of a recipe are cheaper to launch into orbit. Handles fluids in barrels. Check and uncheck parts of a recipe to include or exclude it from the calculation. It also adds the item mass as tool tip.

