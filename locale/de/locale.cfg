[mod-name]
ocs-launching-calculator=OCs Raketentaschenrechner

[mod-description]
ocs-launching-calculator=Berechne ob es billiger ist, die Zutaten oder Produkte eines Bauplans in den Orbit zu befördern. Behandle Flüssigkeiten auch in Fässer verpackt. Aktiviere und deaktiviere einzelne Teile eines Bauplans um sie in die Rechnung ein- oder auszuschließen.

