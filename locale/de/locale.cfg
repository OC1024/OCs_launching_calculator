[mod-setting-description]
round_decimals=Legt die angezeigte Genauigkeit fest. Bei kleinen Werten ungleich null werden bei Bedarf zusätzliche Nachkommastellen angezeigt, um die angegebene Anzahl gültiger Ziffern zu erhalten. Große Werte werden nicht auf höhere Stellen gerundet. Verwende "0", um auf ganze Zahlen zu runden.
oc-calc-show-item-name=Wenn deaktiviert, werden die Namen stattdessen im Tooltip angezeigt.
oc-calc-compact-window-factor=Fensterbreite in Prozent der normalen Breite, wenn die Spalte mit den Gegenstandsnamen ausgeblendet ist.
oc-calc-advanced-mode=Zeige Reihe für Raketensilos und Raketenteile-Rezepte.
