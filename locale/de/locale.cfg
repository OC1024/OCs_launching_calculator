[mod-name]
OCs_launching_calculator=OCs Raketentaschenrechner

[mod-description]
OCs_launching_calculator=Berechne ob es billiger ist, die Zutaten oder Produkte eines Bauplans in den Orbit zu befördern. Behandle Flüssigkeiten auch in Fässer verpackt. Aktiviere und deaktiviere einzelne Teile eines Bauplans um sie in die Rechnung ein- oder auszuschließen. Es fügt auch die Masse eines Gegenstandes dem Tooltip hinzu.

